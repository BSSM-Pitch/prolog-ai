name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 백엔드는 3.12를 쓴다.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          USE_FAKE_LLM: "1"
        run: pytest

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: prolog-ai-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: "030464389728"
      AWS_ROLE_ARN: arn:aws:iam::030464389728:role/prolog-github-ai-deploy
      EC2_INSTANCE_ID: i-064d924fb7a6eb9e8

    steps:
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Sync NVIDIA key to Parameter Store
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$NVIDIA_API_KEY"
          aws ssm put-parameter \
            --name /prolog/prod/nvidia-api-key \
            --type SecureString \
            --value "$NVIDIA_API_KEY" \
            --overwrite \
            >/dev/null

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          parameters="$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            '{commands: [
              "set -eu",
              "exec 9>/var/lock/prolog-deploy.lock",
              "flock -w 1800 9",
              "cd /opt/prolog",
              "git fetch --depth=1 origin master",
              "git checkout --force FETCH_HEAD",
              "KEY=$(aws ssm get-parameter --region ap-northeast-2 --name /prolog/prod/nvidia-api-key --with-decryption --query Parameter.Value --output text)",
              "test -n \"$KEY\"",
              "sudo sed -i \"/^NVIDIA_API_KEY=/d;/^PROLOG_AI_PROVIDER=/d;/^PROLOG_AI_MODEL=/d;/^PROLOG_AI_REASONING_EFFORT=/d\" /opt/prolog/.env.production",
              "printf \"NVIDIA_API_KEY=%s\\nPROLOG_AI_PROVIDER=nvidia\\nPROLOG_AI_MODEL=z-ai/glm-5.3-flash\\nPROLOG_AI_REASONING_EFFORT=low\\n\" \"$KEY\" | sudo tee -a /opt/prolog/.env.production >/dev/null",
              "unset KEY",
              "docker run --rm --volume /opt/prolog:/workspace --workdir /workspace prolog-backend:prod uv lock --upgrade-package prolog-ai",
              ("grep -F " + $sha + " uv.lock >/dev/null"),
              "docker compose -p prolog -f compose.prod.yml config --quiet",
              "docker compose -p prolog -f compose.prod.yml build api",
              "docker compose -p prolog -f compose.prod.yml run --rm migrate",
              "docker compose -p prolog -f compose.prod.yml up -d --no-build --no-deps --force-recreate api outbox-worker notifier-worker extractor-worker ai-worker sweeper-worker caddy",
              "curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1/v1/health",
              "docker compose -p prolog -f compose.prod.yml ps",
              "docker image prune --force"
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy prolog-ai ${GITHUB_SHA}" \
            --timeout-seconds 1800 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          exit_code=1
          for _ in {1..360}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                exit_code=0
                break
                ;;
              Failed|Cancelled|TimedOut)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          exit "$exit_code"
