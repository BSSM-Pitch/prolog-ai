[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prolog-ai"
dynamic = ["version"]
description = "Prolog 서비스의 AI 모듈 패키지"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.version]
path = "src/prolog_ai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prolog_ai"]

[tool.ruff]
line-length = 100
